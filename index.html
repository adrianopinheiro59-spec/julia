<style>
  :root{
    --bg:            #f6f2ea;
    --nude:          #ece0cd;
    --nude-soft:     #f4ebdd;
    --green-deep:    #3f5646;
    --green-mid:     #7c9a80;
    --green-pale:    #d9e3d3;
    --ink:           #2c332b;
    --ink-muted:     #6f7869;
    --line:          #ddd0b9;
    --white:         #fffdf9;
  }

  /* Oral Center usa a mesma paleta nude + a mesma estrutura,
     só troca o tom de destaque (verde -> terracota) pra diferenciar as abas de relance */
  #panel-oralcenter, .modal-overlay.accent-oral{
    --green-deep:  #8a4b34;
    --green-mid:   #c17f5f;
    --green-pale:  #ecd4c4;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Manrope', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }

  ::selection{background:var(--green-pale); color:var(--green-deep);}

  /* subtle paper texture via layered radial gradients */
  .texture{
    position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.5;
    background:
      radial-gradient(circle at 15% 8%, rgba(124,154,128,.10), transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(216,180,140,.14), transparent 45%);
  }

  .shell{ position:relative; z-index:1; max-width:920px; margin:0 auto; padding:40px 24px 90px; }

  /* ---------- header ---------- */
  header.top{
    display:flex; justify-content:space-between; align-items:flex-end;
    gap:20px; margin-bottom:34px; flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:14px; }
  .brand svg{ flex-shrink:0; }
  .brand-text .kicker{
    font-size:12.5px; letter-spacing:.02em; color:var(--ink-muted); margin:0 0 2px;
  }
  .brand-text h1{
    font-family:'Fraunces', serif; font-weight:500; font-size:26px; margin:0;
    color:var(--green-deep); letter-spacing:-.01em;
  }

  /* ---------- tabs ---------- */
  nav.tabs{ display:flex; gap:8px; flex-wrap:wrap; }
  .tab{
    font-family:'Manrope', sans-serif; font-size:14px; font-weight:600;
    padding:9px 18px; border-radius:100px; cursor:pointer; border:1px solid transparent;
    background:transparent; color:var(--ink-muted); transition:background .15s ease, color .15s ease;
    white-space:nowrap;
  }
  .tab.active{ background:var(--green-deep); color:var(--white); }
  .tab.active[data-target="oralcenter"]{ background:#8a4b34; }
  .tab.disabled{
    color:#b3a68f; border:1px dashed var(--line); cursor:default;
  }

  /* ---------- panels ---------- */
  .panel{ display:none; }
  .panel.active{ display:block; animation:rise .35s ease; }
  @keyframes rise{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .empty-state{
    background:var(--nude-soft); border:1px dashed var(--line); border-radius:18px;
    padding:56px 32px; text-align:center; color:var(--ink-muted);
  }
  .empty-state .icon{ margin-bottom:14px; }
  .empty-state h3{
    font-family:'Fraunces', serif; font-weight:500; color:var(--green-deep);
    font-size:19px; margin:0 0 6px;
  }
  .empty-state p{ margin:0; font-size:14.5px; line-height:1.5; max-width:320px; margin:0 auto; }

  /* ---------- hero stats ---------- */
  .period-label{
    font-size:13px; font-weight:700; letter-spacing:.03em; color:var(--green-mid);
    margin:0 0 6px;
  }
  .sync-warning{
    font-size:12.5px; color:#a4523a; background:#fbf0ea; border:1px solid #e8cdbc;
    border-radius:10px; padding:8px 12px; margin:0 0 18px;
  }
  .hero{
    display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin-bottom:26px;
  }
  .hero .big{
    font-family:'Fraunces', serif; font-size:52px; font-weight:500; color:var(--green-deep);
    letter-spacing:-.02em; line-height:1;
  }
  .hero .big-label{ font-size:15px; color:var(--ink-muted); }

  .stat-row{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr));
    gap:12px; margin-bottom:36px;
  }
  .stat-card{
    background:var(--white); border:1px solid var(--line); border-radius:16px;
    padding:16px 18px;
  }
  .stat-card .n{
    font-family:'Fraunces', serif; font-size:24px; font-weight:500; color:var(--green-deep);
  }
  .stat-card .l{ font-size:12.5px; color:var(--ink-muted); margin-top:2px; }

  /* ---------- section titles ---------- */
  .section-title{
    font-family:'Fraunces', serif; font-size:20px; font-weight:500; color:var(--green-deep);
    margin:0 0 4px;
  }
  .section-sub{ font-size:13.5px; color:var(--ink-muted); margin:0 0 20px; }
  .section-head{
    display:flex; justify-content:space-between; align-items:flex-start; gap:14px; flex-wrap:wrap;
  }

  .btn-add{
    display:inline-flex; align-items:center; gap:7px; font-family:'Manrope', sans-serif;
    font-size:13.5px; font-weight:700; color:var(--white); background:var(--green-deep);
    border:none; border-radius:100px; padding:10px 18px; cursor:pointer; flex-shrink:0;
    transition:background .15s ease, transform .1s ease;
  }
  .btn-add:hover{ background:#354a3b; }
  .btn-add:active{ transform:scale(.97); }

  .section-actions{ display:flex; gap:8px; flex-shrink:0; }
  .btn-outline{
    display:inline-flex; align-items:center; gap:7px; font-family:'Manrope', sans-serif;
    font-size:13.5px; font-weight:700; color:var(--green-deep); background:var(--white);
    border:1px solid var(--line); border-radius:100px; padding:10px 18px; cursor:pointer;
    flex-shrink:0; transition:border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .btn-outline:hover{ border-color:var(--green-mid); background:var(--nude-soft); }
  .btn-outline:active{ transform:scale(.97); }

  /* ---------- modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(44,53,43,.45); backdrop-filter:blur(2px);
    display:none; align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .modal-overlay.open{ display:flex; }
  .modal-box{
    background:var(--white); border-radius:20px; padding:28px; max-width:440px; width:100%;
    max-height:88vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.2);
  }
  .modal-box h3{
    font-family:'Fraunces', serif; font-weight:500; font-size:21px; color:var(--green-deep);
    margin:0 0 4px;
  }
  .modal-box .modal-sub{ font-size:13px; color:var(--ink-muted); margin:0 0 20px; }
  .field{ margin-bottom:14px; }
  .field label{
    display:block; font-size:12.5px; font-weight:700; color:var(--ink-muted); margin-bottom:6px;
  }
  .field input{
    width:100%; font-family:'Manrope', sans-serif; font-size:14px; color:var(--ink);
    background:var(--nude-soft); border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; outline:none; transition:border-color .15s ease; box-sizing:border-box;
  }
  .field input:focus{ border-color:var(--green-mid); }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }
  .field-hint{ font-size:11.5px; color:#9a917d; margin-top:4px; }
  .modal-actions{ display:flex; gap:10px; margin-top:20px; }
  .btn-cancel, .btn-save{
    flex:1; font-family:'Manrope', sans-serif; font-size:14px; font-weight:700;
    padding:11px; border-radius:12px; cursor:pointer; border:1px solid var(--line);
  }
  .btn-cancel{ background:var(--white); color:var(--ink-muted); }
  .btn-save{ background:var(--green-deep); border-color:var(--green-deep); color:var(--white); }
  .btn-save:hover{ background:#354a3b; }
  .form-error{ font-size:12.5px; color:#a4523a; margin:-6px 0 12px; display:none; }

  .visit.is-new{ border-color:var(--green-mid); background:#fbfdf8; }
  .badge-new{
    display:inline-block; font-size:10px; font-weight:800; letter-spacing:.03em;
    color:var(--green-deep); background:var(--green-pale); border-radius:100px;
    padding:2px 8px; margin-left:8px; text-transform:uppercase; vertical-align:middle;
  }
  .visit-remove{
    background:none; border:none; color:#b3a68f; cursor:pointer; font-size:16px;
    line-height:1; padding:2px 4px; margin-left:8px; flex-shrink:0;
  }
  .visit-remove:hover{ color:#a4523a; }

  /* ---------- filters ---------- */
  .filters{
    display:flex; gap:10px; flex-wrap:wrap; align-items:center;
    margin-bottom:22px; padding:16px; background:var(--white);
    border:1px solid var(--line); border-radius:16px;
  }
  .filters .search{
    position:relative; flex:1 1 220px; min-width:180px;
  }
  .filters .search svg{
    position:absolute; left:12px; top:50%; transform:translateY(-50%); pointer-events:none;
  }
  .filters .search input{
    width:100%; font-family:'Manrope', sans-serif; font-size:14px; color:var(--ink);
    background:var(--nude-soft); border:1px solid var(--line); border-radius:100px;
    padding:9px 14px 9px 36px; outline:none; transition:border-color .15s ease;
  }
  .filters .search input:focus{ border-color:var(--green-mid); }
  .filters .search input::placeholder{ color:#9a917d; }

  .date-range{
    display:flex; align-items:center; gap:6px; flex-shrink:0;
  }
  .date-range input{
    font-family:'Manrope', sans-serif; font-size:13px; color:var(--ink);
    background:var(--nude-soft); border:1px solid var(--line); border-radius:100px;
    padding:8px 12px; outline:none; transition:border-color .15s ease;
  }
  .date-range input:focus{ border-color:var(--green-mid); }
  .date-range span{ font-size:12px; color:var(--ink-muted); }
  .date-range .clear-dates{
    background:none; border:none; color:#b3a68f; cursor:pointer; font-size:12.5px;
    padding:2px 4px; text-decoration:underline; flex-shrink:0;
  }
  .date-range .clear-dates:hover{ color:#a4523a; }

  .chip-row{ display:flex; gap:6px; flex-wrap:wrap; }
  .chip{
    font-family:'Manrope', sans-serif; font-size:12.5px; font-weight:700;
    padding:7px 13px; border-radius:100px; cursor:pointer; white-space:nowrap;
    background:var(--nude-soft); border:1px solid var(--line); color:var(--ink-muted);
    transition:background .15s ease, color .15s ease, border-color .15s ease;
    text-transform:capitalize;
  }
  .chip:hover{ border-color:var(--green-mid); }
  .chip.active{ background:var(--green-deep); border-color:var(--green-deep); color:var(--white); }

  .filter-status{
    font-size:12.5px; color:var(--ink-muted); margin:-10px 0 18px; min-height:16px;
  }
  .filter-status b{ color:var(--green-deep); }

  .no-results{
    text-align:center; padding:40px 20px; color:var(--ink-muted); font-size:14px;
    background:var(--nude-soft); border:1px dashed var(--line); border-radius:16px; display:none;
  }
  .loading-state{
    text-align:center; padding:60px 20px; color:var(--ink-muted); font-size:14.5px;
  }

  /* ---------- agenda / ledger ---------- */
  .agenda{ display:flex; flex-direction:column; }
  .day-group{ position:relative; padding-left:72px; margin-bottom:6px; }
  .day-group::before{
    content:''; position:absolute; left:27px; top:4px; bottom:-6px; width:1px;
    background:var(--line);
  }
  .day-group:last-child::before{ display:none; }
  .day-badge{
    position:absolute; left:0; top:0; width:56px; text-align:center;
  }
  .day-badge .num{
    font-family:'Fraunces', serif; font-size:20px; color:var(--green-deep); font-weight:500;
    display:block; line-height:1.1;
  }
  .day-badge .mon{
    font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-muted);
  }
  .day-header{
    display:flex; justify-content:space-between; align-items:baseline;
    padding:2px 0 10px; font-size:13px; color:var(--ink-muted); flex-wrap:wrap; gap:6px 14px;
  }
  .day-header .wd{ text-transform:capitalize; font-weight:700; color:var(--green-mid); }
  .day-totals{ display:flex; gap:14px; flex-wrap:wrap; }
  .day-totals span{ display:inline-flex; align-items:center; gap:5px; }
  .day-totals .dot{ width:6px; height:6px; border-radius:50%; display:inline-block; }
  .day-totals .dot.repasse{ background:var(--green-deep); }
  .day-totals .dot.net{ background:#c69c6d; }
  .day-totals b{ color:var(--ink); font-weight:800; }

  .visit{
    background:var(--white); border:1px solid var(--line); border-radius:14px;
    padding:13px 16px; margin-bottom:8px; display:flex; justify-content:space-between;
    align-items:center; gap:12px;
  }
  .visit .who{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .visit .name{ font-weight:700; font-size:14.5px; color:var(--ink); }
  .visit .proc{ font-size:13px; color:var(--ink-muted); }
  .visit .money{ text-align:right; flex-shrink:0; }
  .visit .vclin{ font-weight:700; font-size:14.5px; color:var(--green-deep); }
  .visit .vdent{ font-size:12px; color:var(--ink-muted); }
  .visit.material{ background:var(--nude-soft); border-style:dashed; }
  .visit.material .name{ color:var(--ink-muted); font-weight:600; font-style:italic; }

  /* ---------- breakdown ---------- */
  .breakdown{ margin-top:44px; }
  .bar-row{ margin-bottom:14px; }
  .bar-row .bar-top{
    display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:6px;
  }
  .bar-row .bar-top .pname{ font-weight:700; color:var(--ink); text-transform:capitalize; }
  .bar-row .bar-top .pcount{ color:var(--ink-muted); }
  .bar-track{ background:var(--nude); border-radius:100px; height:9px; overflow:hidden; }
  .bar-fill{ height:100%; background:linear-gradient(90deg, var(--green-mid), var(--green-deep)); border-radius:100px; }

  footer.foot{
    margin-top:50px; padding-top:20px; border-top:1px solid var(--line);
    font-size:12.5px; color:var(--ink-muted); display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;
  }

  @media (max-width:560px){
    .hero .big{ font-size:40px; }
    .day-group{ padding-left:56px; }
    .day-badge{ width:44px; }
    .visit{ flex-direction:column; align-items:flex-start; gap:6px; }
    .visit .money{ text-align:left; }
  }
</style>
</head>

  return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
}
function normalizeProc(p){
  const s = p.toLowerCase();
  if(s.startsWith('consulta')) return 'consulta';
  if(s.startsWith('retorno')) return 'retorno preventivo';
  if(s.includes('exo') || s.includes('exodontia')) return 'exodontia';
  if(s.startsWith('rest')) return 'restauração';
  if(s.startsWith('selante')) return 'selante';
  if(s.startsWith('ulectomia')) return 'ulectomia';
  return p.trim();
}

/* ---------------- estado + sincronização com Google Sheets ---------------- */
const SHEETS_API_URL = 'https://script.google.com/macros/s/AKfycbxe12lXnKAyD61F1uZVw8opRfaa6EnH8FwqM_rb_2-3RKXzXu-TTdrb4c3QOuawAJtyKg/exec';

class ClinicState{
  constructor(key, seed){
    this.key = key;
    this.rawEmbedded = seed;
    this.extraEntries = [];
    this.raw = this.rawEmbedded;
    this.syncError = false;
  }
  async fetchExtra(){
    try{
      const res = await fetch(`${SHEETS_API_URL}?clinic=${encodeURIComponent(this.key)}`);
      if(!res.ok) throw new Error('resposta não ok');
      const data = await res.json();
      this.extraEntries = data
        .filter(e => e.date && /^\d{1,2}\/\d{1,2}\/\d{4}$/.test(String(e.date).trim()) && e.name)
        .map(e => ({
          date: e.date, name: e.name, proc: e.proc,
          vclin: e.vclin, vdent: e.vdent,
          _id: e.id, _extra: true
        }));
      this.syncError = false;
    }catch(err){
      this.syncError = true;
    }
    this.raw = this.rawEmbedded.concat(this.extraEntries);
  }
  async addEntry(entry){
    const id = 'e' + Date.now() + Math.floor(Math.random()*1000);
    await fetch(SHEETS_API_URL, {
      method: 'POST',
      body: JSON.stringify({ action:'add', clinic:this.key, id, ...entry })
    });
    this.extraEntries.push({ ...entry, _id:id, _extra:true });
    this.raw = this.rawEmbedded.concat(this.extraEntries);
  }
  async removeEntry(id){
    await fetch(SHEETS_API_URL, {
      method: 'POST',
      body: JSON.stringify({ action:'delete', clinic:this.key, id })
    });
    this.extraEntries = this.extraEntries.filter(e => e._id !== id);
    this.raw = this.rawEmbedded.concat(this.extraEntries);
  }
}

/* ---------------- painel de um consultório ---------------- */
function buildClinicPanel(key){
  const cfg = CLINICS[key];
  const state = clinicState[key];
  const raw = state.raw;

  const panel = document.createElement('section');
  panel.className = 'panel' + (key === clinicKeys[0] ? ' active' : '');
  panel.id = 'panel-' + key;

  const byDate = [];
  const dateIndex = {};
  raw.forEach(row => {
    if(!dateIndex.hasOwnProperty(row.date)){
      dateIndex[row.date] = byDate.length;
      byDate.push({date:row.date, items:[]});
    }
    byDate[dateIndex[row.date]].items.push(row);
  });
  byDate.sort((a,b) => toDateObj(a.date) - toDateObj(b.date));

  const totalClin = raw.reduce((s,r) => s + (r.vclin||0), 0);
  const totalDent = raw.reduce((s,r) => s + (r.vdent||0), 0); // repasse total
  const netValue = totalClin - totalDent; // o que fica com quem faturou
  const visits = raw.filter(r => r.name !== 'Material');
  const patients = new Set(visits.map(r => r.name)).size;
  const days = byDate.filter(g=>g.date).length;
  const avgRepasseDia = days ? totalDent / days : 0;

  const sortedDates = byDate.map(g => toDateObj(g.date)).sort((a,b) => a-b);
  function periodLabel(){
    if(sortedDates.length === 0) return 'Nenhum atendimento cadastrado ainda';
    const first = sortedDates[0], last = sortedDates[sortedDates.length-1];
    const fLabel = `${MONTHS_PT_UP[first.getMonth()]} ${first.getFullYear()}`;
    const lLabel = `${MONTHS_PT_UP[last.getMonth()]} ${last.getFullYear()}`;
    return fLabel === lLabel ? fLabel : `${fLabel} – ${lLabel}`;
  }

  panel.innerHTML = `
    <p class="period-label">${periodLabel()}</p>
    ${state.syncError ? `<p class="sync-warning">⚠️ não foi possível sincronizar com a planilha agora — mostrando só os dados originais. Tente "Atualizar" ou confira sua internet.</p>` : ''}
    <div class="hero">
      <span class="big">${brl(totalClin)}</span>
      <span class="big-label">faturado por ${cfg.billedBy} no período</span>
    </div>
    <div class="stat-row">
      <div class="stat-card"><div class="n">${brl(avgRepasseDia)}</div><div class="l">média/dia · ${cfg.repasseTo}</div></div>
      <div class="stat-card"><div class="n">${brl(totalDent)}</div><div class="l">repasse pra ${cfg.repasseTo}</div></div>
      <div class="stat-card"><div class="n">${brl(netValue)}</div><div class="l">fica com ${cfg.netLabel}</div></div>
      <div class="stat-card"><div class="n">${visits.length}</div><div class="l">atendimentos</div></div>
      <div class="stat-card"><div class="n">${patients}</div><div class="l">pacientes distintos</div></div>
      <div class="stat-card"><div class="n">${days}</div><div class="l">dias com agenda</div></div>
    </div>

    <div class="section-head">
      <div>
        <h2 class="section-title">Agenda do período</h2>
        <p class="section-sub">Cada linha é um atendimento, na ordem em que foi lançado.</p>
      </div>
      <div class="section-actions">
        <button class="btn-outline" id="refreshBtn" title="Buscar atualizações da planilha">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M12 3.5A5.5 5.5 0 1 0 13 7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M12 1.5v2.5H9.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Atualizar
        </button>
        <button class="btn-outline" id="downloadExcelBtn">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1v8m0 0L4 6m3 3l3-3M2 12h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Baixar Excel
        </button>
        <button class="btn-add" id="openAddModal">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          Novo atendimento
        </button>
      </div>
    </div>

    <div class="filters">
      <div class="search">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="6.5" cy="6.5" r="5" stroke="#8fa38f" stroke-width="1.4"/><path d="M10.3 10.3L13.5 13.5" stroke="#8fa38f" stroke-width="1.4" stroke-linecap="round"/></svg>
        <input type="text" id="nameFilter" placeholder="Buscar paciente...">
      </div>
      <div class="date-range">
        <input type="date" id="dateFrom" title="Data início">
        <span>até</span>
        <input type="date" id="dateTo" title="Data fim">
        <button class="clear-dates" id="clearDates">limpar</button>
      </div>
      <div class="chip-row" id="procFilters"></div>
    </div>
    <p class="filter-status" id="filterStatus"></p>

    <div class="agenda" id="agenda"></div>
    <div class="no-results" id="noResults">Nenhum atendimento encontrado com esses filtros.</div>
    <div class="empty-state" id="emptyClinic" style="display:none;">
      <div class="icon">
        <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
          <circle cx="17" cy="17" r="16" stroke="#c9bda3" stroke-width="1.4" stroke-dasharray="3 4"/>
          <path d="M17 11v12M11 17h12" stroke="#8fa38f" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </div>
      <h3>Sem atendimentos ainda</h3>
      <p>Clique em "Novo atendimento" pra começar a cadastrar aqui.</p>
    </div>

    <div class="breakdown">
      <h2 class="section-title">Procedimentos mais frequentes</h2>
      <p class="section-sub">Contagem de lançamentos por tipo de procedimento.</p>
      <div id="bars"></div>
    </div>
  `;

  panelsEl.appendChild(panel);

  const agendaEl = panel.querySelector('#agenda');
  const emptyClinicEl = panel.querySelector('#emptyClinic');

  if(byDate.length === 0){
    agendaEl.style.display = 'none';
    emptyClinicEl.style.display = 'block';
  } else {
    const byDateDesc = byDate.slice().reverse();
    byDateDesc.forEach(group => {
      if(!group.date) return;
      const dObj = toDateObj(group.date);
      const dayNum = dObj.getDate();
      const monLabel = MONTHS_PT[dObj.getMonth()];
      const wd = WD_PT[dObj.getDay()];

      const wrap = document.createElement('div');
      wrap.className = 'day-group';
      wrap.dataset.date = group.date;
      wrap.innerHTML = `
        <div class="day-badge"><span class="num">${dayNum}</span><span class="mon">${monLabel}</span></div>
        <div class="day-header">
          <span class="wd">${wd}-feira</span>
          <span class="day-totals">
            <span class="dt-repasse"><span class="dot repasse"></span>${cfg.repasseTo} <b></b></span>
            <span class="dt-net"><span class="dot net"></span>${cfg.netLabel} <b></b></span>
          </span>
        </div>
        <div class="visits"></div>
      `;
      const visitsEl = wrap.querySelector('.visits');
      group.items.forEach(item => {
        const v = document.createElement('div');
        const isMaterial = item.name === 'Material';
        const isExtra = !!item._extra;
        const cats = item.proc.split('+').map(p => normalizeProc(p.trim()));
        v.className = 'visit' + (isMaterial ? ' material' : '') + (isExtra ? ' is-new' : '');
        v.dataset.name = normalizeStr(item.name);
        v.dataset.proc = isMaterial ? '' : cats.join('|').toLowerCase();
        v.dataset.vclin = item.vclin || 0;
        v.dataset.vdent = item.vdent || 0;
        v.innerHTML = `
          <div class="who">
            <span class="name">${item.name}${isExtra ? '<span class="badge-new">novo</span>' : ''}</span>
            <span class="proc">${item.proc}</span>
          </div>
          <div class="money">
            <div class="vclin">${item.vclin!=null ? brl(item.vclin) : '—'}</div>
            <div class="vdent">${brl(item.vdent)} p/ ${cfg.repasseTo}</div>
          </div>
          ${isExtra ? `<button class="visit-remove" data-remove-id="${item._id}" title="Remover">×</button>` : ''}
        `;
        visitsEl.appendChild(v);
      });
      agendaEl.appendChild(wrap);
    });
  }

  // procedure breakdown
  const counts = {};
  visits.forEach(r => {
    const parts = r.proc.split('+').map(x=>x.trim());
    parts.forEach(p => {
      const catKey = normalizeProc(p);
      counts[catKey] = (counts[catKey]||0) + 1;
    });
  });
  const barsEl = panel.querySelector('#bars');
  const categories = Object.keys(counts).sort();
  if(categories.length === 0){
    barsEl.innerHTML = `<p class="section-sub" style="margin:0;">Sem procedimentos cadastrados ainda.</p>`;
  } else {
    const maxCount = Math.max(...Object.values(counts));
    Object.entries(counts).sort((a,b)=>b[1]-a[1]).forEach(([name,count]) => {
      const row = document.createElement('div');
      row.className = 'bar-row';
      row.innerHTML = `
        <div class="bar-top"><span class="pname">${name}</span><span class="pcount">${count}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${(count/maxCount*100).toFixed(0)}%"></div></div>
      `;
      barsEl.appendChild(row);
    });
  }

  /* ---------- filtros ---------- */
  const procFiltersEl = panel.querySelector('#procFilters');
  const allChip = document.createElement('button');
  allChip.className = 'chip active';
  allChip.textContent = 'Todos os procedimentos';
  allChip.dataset.value = '';
  procFiltersEl.appendChild(allChip);
  categories.forEach(cat => {
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.textContent = cat;
    chip.dataset.value = cat;
    procFiltersEl.appendChild(chip);
  });

  let activeProc = '';
  const nameInput = panel.querySelector('#nameFilter');
  const dateFromInput = panel.querySelector('#dateFrom');
  const dateToInput = panel.querySelector('#dateTo');
  const clearDatesBtn = panel.querySelector('#clearDates');
  const statusEl = panel.querySelector('#filterStatus');
  const noResultsEl = panel.querySelector('#noResults');
  const totalVisitCount = visits.length;

  function applyFilters(){
    if(byDate.length === 0){
      statusEl.textContent = '';
      return;
    }
    const term = normalizeStr(nameInput.value.trim());
    const fromVal = dateFromInput.value;
    const toVal = dateToInput.value;
    const fromDate = fromVal ? new Date(fromVal + 'T00:00:00') : null;
    const toDate = toVal ? new Date(toVal + 'T23:59:59') : null;
    let visibleCount = 0;

    agendaEl.querySelectorAll('.day-group').forEach(dayEl => {
      const dGroupDate = toDateObj(dayEl.dataset.date);
      const inRange = (!fromDate || dGroupDate >= fromDate) && (!toDate || dGroupDate <= toDate);
      if(!inRange){
        dayEl.style.display = 'none';
        return;
      }
      let dayVclin = 0, dayVdent = 0;
      let anyVisible = false;
      dayEl.querySelectorAll('.visit').forEach(v => {
        if(v.classList.contains('material')){
          v.style.display='none';
          dayVdent += parseFloat(v.dataset.vdent) || 0;
          return;
        }
        const nameMatch = !term || v.dataset.name.includes(term);
        const procMatch = !activeProc || v.dataset.proc.split('|').includes(activeProc);
        const show = nameMatch && procMatch;
        v.style.display = show ? 'flex' : 'none';
        if(show){
          anyVisible = true;
          visibleCount++;
          dayVclin += parseFloat(v.dataset.vclin) || 0;
          dayVdent += parseFloat(v.dataset.vdent) || 0;
        }
      });
      dayEl.style.display = anyVisible ? 'block' : 'none';
      const repB = dayEl.querySelector('.dt-repasse b');
      const netB = dayEl.querySelector('.dt-net b');
      repB.textContent = anyVisible ? brl(dayVdent) : '—';
      netB.textContent = anyVisible ? brl(dayVclin - dayVdent) : '—';
    });

    noResultsEl.style.display = visibleCount === 0 ? 'block' : 'none';
    agendaEl.style.display = visibleCount === 0 ? 'none' : 'flex';

    if(!term && !activeProc && !fromVal && !toVal){
      statusEl.textContent = `Mostrando todos os ${totalVisitCount} atendimentos`;
    } else {
      statusEl.innerHTML = `Mostrando <b>${visibleCount}</b> de ${totalVisitCount} atendimentos`;
    }
  }

  nameInput.addEventListener('input', () => {
    // busca por nome sempre volta o filtro de procedimento pra "Todos",
    // assim o paciente não fica escondido por um chip que ficou selecionado antes
    if(nameInput.value.trim() && activeProc){
      activeProc = '';
      procFiltersEl.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.value === ''));
    }
    applyFilters();
  });
  dateFromInput.addEventListener('change', applyFilters);
  dateToInput.addEventListener('change', applyFilters);
  clearDatesBtn.addEventListener('click', () => {
    dateFromInput.value = '';
    dateToInput.value = '';
    applyFilters();
  });
  procFiltersEl.addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if(!chip) return;
    procFiltersEl.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    activeProc = chip.dataset.value;
    applyFilters();
  });

  panel.querySelector('#openAddModal').addEventListener('click', () => openAddModal(key));
  panel.querySelector('#downloadExcelBtn').addEventListener('click', () => exportExcelClinic(key));
  panel.querySelector('#refreshBtn').addEventListener('click', async (e) => {
    const btn = e.currentTarget;
    btn.disabled = true;
    btn.style.opacity = '.6';
    await clinicState[key].fetchExtra();
    rerenderClinic(key);
  });
  agendaEl.addEventListener('click', (e) => {
    const btn = e.target.closest('.visit-remove');
    if(!btn) return;
    removeExtraEntry(key, btn.dataset.removeId);
  });

  applyFilters();
}

function rerenderClinic(key){
  const old = document.getElementById('panel-' + key);
  const wasActive = old ? old.classList.contains('active') : (key === clinicKeys[0]);
  if(old) old.remove();
  buildClinicPanel(key);
  const fresh = document.getElementById('panel-' + key);
  fresh.classList.toggle('active', wasActive);
}

let modalTargetKey = clinicKeys[0];

const modalOverlay = document.createElement('div');
modalOverlay.className = 'modal-overlay';
modalOverlay.id = 'addModal';
modalOverlay.innerHTML = `

function openAddModal(key){
  modalTargetKey = key;
  document.getElementById('modalTitle').textContent = 'Novo atendimento · ' + CLINICS[key].tabLabel;
  document.getElementById('f-vdent-label').textContent = 'Repasse p/ ' + CLINICS[key].repasseTo + ' (R$)';

function recalcRepasse(){
  const vclin = parseFloat(document.getElementById('f-vclin').value);
  const pct = parseFloat(document.getElementById('f-pct').value);
  if(!isNaN(vclin) && !isNaN(pct)){
    document.getElementById('f-vdent').value = (vclin * pct / 100).toFixed(2);
  }
}
document.getElementById('f-vclin').addEventListener('input', recalcRepasse);
document.getElementById('f-pct').addEventListener('input', recalcRepasse);
document.getElementById('f-proc').addEventListener('input', () => {
  const p = document.getElementById('f-proc').value.trim().toLowerCase();
  document.getElementById('f-pct').value = p.startsWith('consulta') ? '25' : '20';
  recalcRepasse();
});

document.getElementById('f-save').addEventListener('click', async () => {
  const name = document.getElementById('f-name').value.trim();
  const proc = document.getElementById('f-proc').value.trim() || 'consulta';
  const vclinRaw = document.getElementById('f-vclin').value;
  const vdentRaw = document.getElementById('f-vdent').value;
  const dateRaw = document.getElementById('f-date').value;
  const errEl = document.getElementById('f-error');

  if(!name || !dateRaw || (!vclinRaw && !vdentRaw)){
    errEl.textContent = 'Preenche pelo menos o nome do paciente e um dos valores.';
    errEl.style.display = 'block';
    return;
  }

  const dateBR = `${d}/${m}/${y}`;

  saveBtn.disabled = true;
  saveBtn.textContent = 'Salvando...';
  try{
    await clinicState[modalTargetKey].addEntry({
      date: dateBR,

      vclin: vclinRaw ? parseFloat(vclinRaw) : null,
      vdent: vdentRaw ? parseFloat(vdentRaw) : 0
    });

    rerenderClinic(modalTargetKey);
  }catch(err){
    errEl.textContent = 'Não foi possível salvar na planilha agora. Verifique sua internet e tente de novo.';
    errEl.style.display = 'block';
  }
  saveBtn.disabled = false;
  saveBtn.textContent = 'Salvar atendimento';
});

async function removeExtraEntry(key, id){
  await clinicState[key].removeEntry(id);
  rerenderClinic(key);
}

function exportExcelClinic(key){
  if(typeof XLSX === 'undefined'){
    alert('Não foi possível carregar a biblioteca de exportação. Verifique sua conexão com a internet e tente de novo.');
    return;
  }
  const cfg = CLINICS[key];
  const dataset = clinicState[key].raw;
  const header = ['Data','Paciente','Procedimento','Valor Clínica','Valor Repasse (' + cfg.repasseTo + ')'];
  const rows = dataset.slice().sort((a,b) => toDateObj(a.date) - toDateObj(b.date))
    .map(r => [r.date, r.name, r.proc, r.vclin!=null ? r.vclin : '', r.vdent!=null ? r.vdent : '']);
  const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);
  ws['!cols'] = [{wch:12},{wch:32},{wch:30},{wch:14},{wch:20}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, cfg.tabLabel);
  const today = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `consultorio-dr-julia-${key}-${today}.xlsx`);
}

/* ---------------- carregamento inicial ---------------- */
panelsEl.innerHTML = `<div class="loading-state">Carregando dados da planilha...</div>`;
Promise.all(clinicKeys.map(key => clinicState[key].fetchExtra())).then(() => {
  panelsEl.innerHTML = '';
  clinicKeys.forEach(key => buildClinicPanel(key));
});
</script>
